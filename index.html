<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bulk Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column for a phone at the rack. A dark Next workout card leads, session pills sit under it, exercise cards carry their order number, and the three areas live in a bottom tab bar. */
:root {
  --bg: #F1F3F6;
  --surface: #FFFFFF;
  --raised: #F6F7F9;
  --ink: #11161C;
  --muted: #5D6876;
  --line: #E2E6EC;
  --soft: #E9EDF2;
  --accent: #D32F25;
  --accent-ink: #FFFFFF;
  --accent-soft: #FCE8E6;
  --good: #167A45;
  --good-bg: #DEF3E6;
  --warn: #7A5300;
  --warn-bg: #FBEECB;
  --hero-bg: #11161C;
  --hero-fg: #F4F6F8;
  --hero-mute: #A5AFBB;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 6px 18px rgba(16, 24, 40, 0.05);
  --plate-red: #D7352B;
  --plate-blue: #2457C5;
  --plate-yellow: #E8B20A;
  --plate-green: #2E9A55;
  --plate-white: #AEB7C2;
  --f-display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1014; --surface: #151B22; --raised: #1B222B; --ink: #EDF0F4; --muted: #98A3B0; --line: #252D37; --soft: #1F2730;
    --accent: #FF6153; --accent-ink: #1B0604; --accent-soft: #3A1B18;
    --good: #5FD08D; --good-bg: #143324; --warn: #F2C05C; --warn-bg: #3A2D0E;
    --hero-bg: #1E2832; --hero-fg: #F2F5F8; --hero-mute: #9DA9B7;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    --plate-red: #F0483D; --plate-blue: #5B8CF0; --plate-yellow: #F2C230; --plate-green: #4CC27A; --plate-white: #8591A0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1014; --surface: #151B22; --raised: #1B222B; --ink: #EDF0F4; --muted: #98A3B0; --line: #252D37; --soft: #1F2730;
  --accent: #FF6153; --accent-ink: #1B0604; --accent-soft: #3A1B18;
  --good: #5FD08D; --good-bg: #143324; --warn: #F2C05C; --warn-bg: #3A2D0E;
  --hero-bg: #1E2832; --hero-fg: #F2F5F8; --hero-mute: #9DA9B7;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  --plate-red: #F0483D; --plate-blue: #5B8CF0; --plate-yellow: #F2C230; --plate-green: #4CC27A; --plate-white: #8591A0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.45 var(--f-body);
  padding-block: 18px 108px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.app > * { min-width: 0; }
button, input, select { font-family: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* header */
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
.logo .ic { width: 22px; height: 22px; }
h1 { margin: 0; font: 700 30px/0.95 var(--f-display); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); background: var(--surface); white-space: nowrap; flex: none; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: 0.7; }
.pill.ok { color: var(--good); border-color: transparent; background: var(--good-bg); }
.pill.ok::before { background: var(--good); opacity: 1; }

/* bottom tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 6px;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-top: 1px solid var(--line); }
.tab { flex: 1; max-width: 190px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 6px; border: 0; border-radius: 12px; background: none; color: var(--muted); cursor: pointer;
  font: 600 10.5px/1.1 var(--f-body); letter-spacing: 0.07em; text-transform: uppercase; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }

/* next workout */
.nextwk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; width: 100%; text-align: left; padding: 16px; border: 0; border-radius: 16px; background: var(--hero-bg); color: var(--hero-fg); cursor: pointer; font: 400 14px var(--f-body); box-shadow: var(--shadow); }
.next-k { grid-column: 1; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--hero-mute); text-transform: uppercase; letter-spacing: 0.1em; }
.next-k .ic { width: 14px; height: 14px; }
.next-v { grid-column: 2; grid-row: 1 / span 2; display: flex; align-items: center; gap: 10px; font: 700 40px/1 var(--f-display); letter-spacing: 0.04em; text-transform: uppercase; }
.next-v .ic { width: 26px; height: 26px; color: var(--accent); }
.next-s { grid-column: 1; font-weight: 600; font-size: 15px; }
.next-t { grid-column: 1 / -1; font-size: 13px; color: var(--hero-mute); margin-top: 6px; }

/* sessions */
.chips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.chip { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 2px; min-height: 42px; border: 1px solid var(--line); background: var(--surface);
  color: var(--muted); border-radius: 99px; font: 600 13px var(--f-body); cursor: pointer; min-width: 0; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.plate { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }

.hint { margin: 0; color: var(--muted); font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.ghost { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--ink); font: 500 13px var(--f-body); cursor: pointer; }
.ghost .ic { width: 16px; height: 16px; }

/* exercise cards */
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.ex-head { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; padding: 14px; color: inherit; font: inherit; cursor: pointer; }
.ex-l { display: flex; flex-direction: column; gap: 5px; min-width: 0; align-items: flex-start; flex: 1; }
.ex-name { font-weight: 600; font-size: 15px; }
.ex-meta { color: var(--muted); font-size: 13px; }
.idx { width: 28px; height: 28px; border-radius: 50%; background: var(--soft); color: var(--muted); display: grid; place-items: center; flex: none; font: 700 15px/1 var(--f-display); font-variant-numeric: tabular-nums; align-self: flex-start; }
.idx .ic { width: 15px; height: 15px; }
.wk.done .idx { background: var(--good-bg); color: var(--good); }
.chev { color: var(--muted); transition: transform 0.15s; }
.ex-head[aria-expanded="true"] .chev { transform: rotate(180deg); }
.big { font: 700 34px/1 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.big small { font: 500 12px var(--f-body); color: var(--muted); margin-left: 4px; }
.tgt { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.tgt-k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 99px; background: var(--soft); color: var(--muted); }
.badge .ic { width: 12px; height: 12px; }
.badge.good { background: var(--good-bg); color: var(--good); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.ex-meta .badge { margin-left: 4px; }

.ex-body { border-top: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: end; }
.f2 { grid-column: span 2; }
.f3 { grid-column: span 3; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.field input, .field select { width: 100%; height: 46px; padding: 0 12px; font: 400 16px var(--f-body); color: var(--ink); background: var(--raised); border: 1px solid var(--line); border-radius: 12px; font-variant-numeric: tabular-nums; }
.field input:focus, .field select:focus { border-color: var(--accent); background: var(--surface); }
.field .pin { display: flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.field .pin .ic { width: 13px; height: 13px; }
.field .pin b { color: var(--ink); font-weight: 600; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: 600 15px var(--f-body); cursor: pointer; }
.btn .ic { width: 18px; height: 18px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.alt { background: var(--soft); color: var(--ink); }
.link { background: none; border: 0; padding: 6px 0; color: var(--muted); font: 500 13px var(--f-body); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.link.danger { color: var(--accent); }
.msg { margin: 0; min-height: 1.3em; font-size: 13px; color: var(--muted); }
.msg.err { color: var(--accent); }
.note { margin: 0; padding: 9px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }

.chart { min-height: 60px; }
.chart svg { display: block; max-width: 100%; height: auto; }
.gl { stroke: var(--line); stroke-width: 1; fill: none; }
.ax { fill: var(--muted); font: 400 11px var(--f-body); font-variant-numeric: tabular-nums; }
.ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.pt.faint { fill: var(--muted); stroke: none; opacity: 0.55; }
.end { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.val { fill: var(--ink); font: 700 15px var(--f-display); font-variant-numeric: tabular-nums; }
.empty { margin: 0; padding: 14px 0; color: var(--muted); font-size: 13px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 0; }
.legend span::before { content: ""; display: inline-block; vertical-align: middle; margin-right: 6px; }
.legend .l1::before { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); opacity: 0.6; }
.legend .l2::before { width: 16px; height: 3px; border-radius: 2px; background: var(--accent); }
.bar { fill: var(--muted); opacity: 0.4; }
.bar.cur { fill: var(--accent); opacity: 1; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; flex-wrap: wrap; }
.list li:first-child { border-top: 0; }
.list .num { font-variant-numeric: tabular-nums; margin-left: auto; font-weight: 500; }
.list .when { color: var(--muted); }
.list li.editrow { display: block; }
.list li.sum { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.list li.ordrow { flex-wrap: nowrap; padding: 8px 0; }
.ord-n { width: 22px; flex: none; color: var(--muted); font: 700 18px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.ordrow .ex-name { flex: 1; min-width: 0; }
.ordbtns { display: inline-flex; gap: 8px; flex: none; }
.ordbtn { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); color: var(--ink); cursor: pointer; }
.ordbtn:disabled { opacity: 0.3; cursor: not-allowed; }
.h2 { margin: 0; display: flex; align-items: center; gap: 8px; font: 600 14px/1 var(--f-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.h2 .ic { width: 16px; height: 16px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stat { padding: 0 12px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.stat:first-child { padding-left: 0; border-left: 0; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .big { text-align: left; font-size: 32px; }
.stat .s { font-size: 12px; color: var(--muted); }
.verdict { padding: 11px 13px; border-radius: 12px; background: var(--soft); display: flex; flex-direction: column; gap: 2px; }
.verdict.good { background: var(--good-bg); color: var(--good); }
.verdict.warn { background: var(--warn-bg); color: var(--warn); }
.verdict b { font-weight: 600; }
.verdict span { font-size: 13px; }
.wform { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 10px; align-items: end; }

.linked { display: flex; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.linked-l { color: var(--muted); }
.linked-v { font-weight: 600; font-variant-numeric: tabular-nums; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); min-width: 0; }
.day .dn { font-size: 12px; color: var(--muted); }
.day .dd { font: 700 22px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.day .ds { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.day.done { background: var(--good-bg); border-color: var(--good); }
.day.done .ds { color: var(--good); font-weight: 600; }
.day.missed .ds { color: var(--warn); }
.day.off { opacity: 0.55; }
.day.now { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.day.now .ds { color: var(--ink); font-weight: 600; }
.seg { display: inline-flex; align-self: flex-start; padding: 3px; gap: 2px; border-radius: 99px; background: var(--soft); }
.seg button { border: 0; background: none; padding: 8px 18px; min-height: 36px; border-radius: 99px; font: 600 13px var(--f-body); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.prog { margin: 0; font-size: 13px; color: var(--muted); }

/* workout cards */
.wk { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.wk.done { border-color: var(--good); }
.wk-top { display: flex; align-items: flex-start; gap: 12px; }
.wk-l { display: flex; flex-direction: column; gap: 5px; min-width: 0; align-items: flex-start; flex: 1; }
.wk-done { margin: 0; align-self: flex-start; }
.wk .form { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.wk-act { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.wk-act .btn:first-child { flex: 1; }
.acts { display: inline-flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.eform { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; }
.eacts { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; }
.exp { width: 100%; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 10px; resize: vertical; }
.cform { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; }
.cform .span2 { grid-column: span 2; }
.cform .span3 { grid-column: 1 / -1; }
.big.sm { font-size: 26px; }
.foot { margin: 0; color: var(--muted); font-size: 12px; text-align: center; }

@media (max-width: 380px) {
  h1 { font-size: 26px; }
  .sub { font-size: 12px; }
  .big { font-size: 30px; }
  .wform { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .wform .btn { grid-column: span 2; }
  .pill { padding: 4px 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>

5 8.5V6.5A2.5 2.5 0 0 0 13 4H6.5A2.5 2.5 0 0 0 4 6.5V13a2.5 2.5 0 0 0 2.5 2.5h2"/></symbol><symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol><symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15L6 16zM10 21h4"/></symbol></svg>
<div class="app" id="app"></div>

<script>
(function () {
  'use strict';

  /* ---------- exercises (from the training split) ---------- */
  var EX = {
    'flat-db':     { n: 'Flat dumbbell press', each: true },
    'incline-db':  { n: 'Incline dumbbell press', each: true },
    'shoulder-db': { n: 'Dumbbell shoulder press', each: true },
